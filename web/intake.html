<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빨간펜 — 문진</title>
<style>
  @font-face {
    font-family: "Outfit";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("https://cdn.jsdelivr.net/fontsource/fonts/outfit@latest/latin-wght-normal.woff2") format("woff2-variations");
  }
  @font-face {
    font-family: "Noto Sans KR";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("https://cdn.jsdelivr.net/fontsource/fonts/noto-sans-kr@latest/korean-wght-normal.woff2") format("woff2-variations");
  }

  :root {
    --bg: #fafafa; --surface: #fff; --ink: #18181b; --muted: #71717a;
    --faint: #a1a1aa; --line: #e4e4e7; --accent: #be123c; --soft: #f4f4f5;
    --radius: 12px; --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.65 "Noto Sans KR", "Outfit", system-ui, sans-serif;
  }
  a { color: var(--ink); }
  a:hover { color: var(--accent); }

  .nav {
    width: min(680px, calc(100% - 40px)); margin: 0 auto;
    padding: 24px 0 8px; display: flex; justify-content: space-between; align-items: center;
  }
  .logo {
    font-family: "Outfit", sans-serif; font-weight: 650; font-size: 18px;
    letter-spacing: -.03em; text-decoration: none; color: var(--ink);
  }
  .logo em { font-style: normal; color: var(--accent); }
  .nav a.back {
    font-size: 13px; color: var(--muted); text-decoration: none; font-weight: 500;
  }
  .nav a.back:hover { color: var(--ink); }

  .wrap { width: min(680px, calc(100% - 40px)); margin: 0 auto; padding: 20px 0 140px; }

  .intro { margin-bottom: 32px; }
  .intro h1 {
    margin: 0 0 8px; font-family: "Outfit", "Noto Sans KR", sans-serif;
    font-size: clamp(28px, 5vw, 36px); font-weight: 650; letter-spacing: -.035em; line-height: 1.15;
  }
  .intro p { margin: 0; color: var(--muted); font-size: 14.5px; max-width: 42ch; }

  .bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; margin-bottom: 28px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
  }
  .bar b {
    font-family: "Outfit", sans-serif; font-weight: 650; color: var(--ink); font-size: 15px;
  }

  section { padding: 8px 0 28px; }
  .sec-label {
    font-size: 12px; font-weight: 650; color: var(--muted);
    margin-bottom: 18px; letter-spacing: .02em;
  }
  .q { margin-bottom: 24px; }
  .q > label {
    display: block; font-weight: 650; margin-bottom: 8px;
    font-size: 14.5px; letter-spacing: -.01em;
  }
  .num { color: var(--faint); font-weight: 500; margin-right: 6px; font-family: "Outfit", sans-serif; }
  .req { color: var(--accent); font-size: 11px; margin-left: 6px; font-weight: 650; }
  .hint { color: var(--muted); font-size: 13px; margin: -2px 0 8px; }

  input[type=text], textarea, select {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px;
    font: inherit; background: var(--surface); color: var(--ink);
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  textarea { resize: vertical; min-height: 88px; }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(24, 24, 27, .08);
  }

  .radios { display: flex; flex-wrap: wrap; gap: 8px; }
  .radios label {
    font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); cursor: pointer; font-size: 13.5px;
    transition: border-color .15s var(--ease), background .15s var(--ease);
  }
  .radios label:has(input:checked) {
    border-color: var(--ink); background: var(--soft);
  }
  .radios input { accent-color: var(--accent); }

  .catalog { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
  @media (max-width: 560px) { .catalog { grid-template-columns: 1fr; } }
  .catalog label { font-weight: 400; display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 13.5px; }
  .item { padding: 8px 0; border-bottom: 1px solid transparent; }
  .item.on { border-bottom-color: var(--line); }
  .freq { display: none; margin: 6px 0 4px 26px; }
  .item.on .freq { display: block; }
  .freq select { width: auto; font-size: 13px; padding: 6px 10px; }

  .foot {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); padding: 14px 20px;
  }
  .foot-in {
    width: min(680px, 100%); margin: 0 auto;
    display: flex; gap: 12px; align-items: center;
  }
  button {
    font: inherit; padding: 12px 20px; border: none; border-radius: 999px;
    background: var(--ink); color: #fff; cursor: pointer; font-weight: 650;
    letter-spacing: -.01em; transition: background .2s var(--ease), transform .15s var(--ease);
  }
  button:hover { background: #27272a; }
  button:disabled { background: #d4d4d8; color: #fff; cursor: not-allowed; }
  .msg { font-size: 13px; color: var(--muted); }
  .msg.ok { color: var(--ink); }
</style>
</head>
<body>
<nav class="nav">
  <a class="logo" href="./"><em>빨간</em>펜</a>
  <a class="back" href="./">← 편집국</a>
</nav>

<div class="wrap">
  <div class="intro">
    <h1>문진</h1>
    <p>기억나는 만큼만 답하세요. 필수는 문항 1과 10뿐입니다.</p>
  </div>

  <div class="bar">
    <span><b id="cnt">0</b> / 12 답변</span>
    <span id="need">필수 2개 남음</span>
  </div>

  <section>
    <div class="sec-label">대상</div>
    <div class="q">
      <label><span class="num">1</span>이 문서를 최종 승인하는 분은 누구인가요?<span class="req">필수</span></label>
      <p class="hint">이름 대신 이니셜만. 예: 김민수 → KMS</p>
      <input type="text" id="reviewer" placeholder="KMS">
    </div>
    <div class="q">
      <label><span class="num">2</span>보통 어떻게 보고하나요?</label>
      <div class="radios" id="report_form">
        <label><input type="radio" name="rf" value="구두 회의">구두 회의</label>
        <label><input type="radio" name="rf" value="문서 회람">문서 회람</label>
        <label><input type="radio" name="rf" value="메신저">메신저</label>
        <label><input type="radio" name="rf" value="대면 1:1">대면 1:1</label>
      </div>
    </div>
  </section>

  <section>
    <div class="sec-label">반려 경험</div>
    <div class="q">
      <label><span class="num">3</span>아래 말 중에, <u>실제로 들어본 것</u>을 모두 골라 주세요</label>
      <p class="hint">억지로 떠올리지 마세요. 읽다가 기억나면 체크하면 됩니다.</p>
      <div class="catalog" id="catalog"></div>
    </div>
    <div class="q">
      <label><span class="num">5</span>위 목록에 없는 말인데, 자주 들은 게 있나요?</label>
      <p class="hint">있으면 적어 주세요. 쉼표로 나눠 최대 3개</p>
      <input type="text" id="heard_free" placeholder="예: 집계 기간을 자주 물어봄">
    </div>
    <div class="q">
      <label><span class="num">6</span>반려됐을 때와 통과됐을 때, 문서가 뭐가 달랐나요?</label>
      <p class="hint">한 줄이면 됩니다. 없으면 비워 두세요</p>
      <input type="text" id="diff_rejected_vs_passed" placeholder="예: 통과한 건 첫 장에 결론이 있었음">
    </div>
  </section>

  <section>
    <div class="sec-label">통과 조건</div>
    <div class="q">
      <label><span class="num">7</span>한 번에 통과된 적이 있다면, 그때 문서에 뭐가 있었나요?</label>
      <p class="hint">없으면 비워 두세요</p>
      <textarea id="passed_why" placeholder="예: 표 아래에 출처와 집계 기준을 달았을 때"></textarea>
    </div>
    <div class="q">
      <label><span class="num">8</span>그분이 문서를 열면 어디를 먼저 보시나요?</label>
      <div class="radios" id="reads_first">
        <label><input type="radio" name="rd" value="첫 장">첫 장</label>
        <label><input type="radio" name="rd" value="숫자 표">숫자 표</label>
        <label><input type="radio" name="rd" value="결론">결론</label>
        <label><input type="radio" name="rd" value="일정">일정</label>
        <label><input type="radio" name="rd" value="모름">모름</label>
      </div>
    </div>
    <div class="q">
      <label><span class="num">9</span>확실히 싫어하시는 게 있나요?</label>
      <p class="hint">없으면 비워 두세요</p>
      <input type="text" id="dislikes" placeholder="예: 장표가 5장 넘어가는 것">
    </div>
  </section>

  <section>
    <div class="sec-label">이번 문서</div>
    <div class="q">
      <label><span class="num">10</span>이번에 보고하려는 문서, 한 줄로 뭐 하는 건가요?<span class="req">필수</span></label>
      <input type="text" id="doc_purpose" placeholder="예: 회의실 예약 시스템 개선안 승인 요청">
    </div>
    <div class="q">
      <label><span class="num">11</span>이번 문서에서 제일 자신 없는 부분은?</label>
      <p class="hint">없으면 비워 두세요</p>
      <input type="text" id="my_worry" placeholder="예: 비용 근거가 약함">
    </div>
    <div class="q">
      <label><span class="num">12</span>초안이 있으면 붙여넣어 주세요</label>
      <p class="hint">비우면 가이드 모드, 붙여넣으면 검수 모드입니다.</p>
      <textarea id="draft" rows="6" placeholder="없으면 비워 두세요"></textarea>
    </div>
  </section>
</div>

<div class="foot"><div class="foot-in">
  <button id="copy" disabled>답변 복사하기</button>
  <span class="msg" id="msg">문항 1과 10을 채우면 복사할 수 있습니다</span>
</div></div>

<script>
const CATALOG = [
  "이 숫자 어디서 나왔어요?", "결론이 뭐예요?",
  "대안은 없어요?", "너무 길어요",
  "이거 누가 하는 거예요?", "언제까지예요?",
  "비용은요?", "리스크는요?",
  "전에 했던 거랑 뭐가 달라요?", "다른 팀이랑 얘기됐어요?",
  "그래서 나한테 뭘 해달라는 거예요?", "이거 왜 지금이에요?"
];
const FREQ = ["4회 이상", "2~3회", "1회", "기억 안 남"];

const box = document.getElementById("catalog");
CATALOG.forEach((label, i) => {
  const d = document.createElement("div");
  d.className = "item";
  d.innerHTML =
    `<label><input type="checkbox" data-q="${label}" id="c${i}"><span>"${label}"</span></label>
     <div class="freq"><select id="f${i}">${
       FREQ.map(f => `<option${f === "2~3회" ? " selected" : ""}>${f}</option>`).join("")
     }</select></div>`;
  d.querySelector("input").addEventListener("change", e => {
    d.classList.toggle("on", e.target.checked); refresh();
  });
  box.appendChild(d);
});

const val = id => (document.getElementById(id).value || "").trim();
const radio = name => (document.querySelector(`input[name=${name}]:checked`) || {}).value || "";

function heard() {
  return CATALOG.map((label, i) =>
    document.getElementById("c" + i).checked
      ? { q: label, freq: document.getElementById("f" + i).value } : null
  ).filter(Boolean);
}

function build() {
  const h = heard();
  const free = val("heard_free") ? val("heard_free").split(",").map(s => s.trim()).filter(Boolean).slice(0, 3) : [];
  const answers = {
    1: val("reviewer"), 2: radio("rf"), 3: h.length ? "y" : "", 4: h.length ? "y" : "",
    5: free.length ? "y" : "", 6: val("diff_rejected_vs_passed"), 7: val("passed_why"),
    8: radio("rd"), 9: val("dislikes"), 10: val("doc_purpose"),
    11: val("my_worry"), 12: val("draft")
  };
  const skipped = Object.keys(answers).filter(k => !answers[k]).map(Number);
  return {
    payload: {
      reviewer: val("reviewer"),
      report_form: radio("rf"),
      heard: h,
      heard_free: free,
      diff_rejected_vs_passed: val("diff_rejected_vs_passed"),
      passed_why: val("passed_why"),
      reads_first: radio("rd"),
      dislikes: val("dislikes"),
      doc_purpose: val("doc_purpose"),
      my_worry: val("my_worry"),
      draft: val("draft") || "없음",
      skipped
    },
    answered: 12 - skipped.length,
    ready: !!val("reviewer") && !!val("doc_purpose")
  };
}

function refresh() {
  const s = build();
  document.getElementById("cnt").textContent = s.answered;
  document.getElementById("need").textContent = s.ready ? "필수 완료" : "필수 2개 남음";
  document.getElementById("copy").disabled = !s.ready;
  const m = document.getElementById("msg");
  if (s.ready) { m.textContent = "복사한 뒤 Claude Code 에 붙여넣으세요"; m.className = "msg ok"; }
  else { m.textContent = "문항 1과 10을 채우면 복사할 수 있습니다"; m.className = "msg"; }
}

document.querySelectorAll("input,textarea,select").forEach(el => {
  el.addEventListener("input", refresh); el.addEventListener("change", refresh);
});

document.getElementById("copy").addEventListener("click", async () => {
  const json = JSON.stringify(build().payload, null, 2);
  const m = document.getElementById("msg");
  try {
    await navigator.clipboard.writeText(json);
  } catch {
    const t = document.createElement("textarea");
    t.value = json; t.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
  }
  m.textContent = "복사됨 · Claude Code 에서 /intake 실행 · 편집국 보드를 열어 두세요";
  m.className = "msg ok";
});

refresh();
</script>
</body>
</html>
