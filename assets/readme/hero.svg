<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif">
  <title id="hero-title">빨간펜 (Red Pen)</title>
  <desc id="hero-desc">반복될 지적을 미리 잡고 회의에서 나올 질문까지 준비하는 멀티에이전트를 Claude Code 로 직접 만드는 3시간 워크숍. 오른쪽은 체크리스트 항목마다 붙는 신뢰등급(high/medium/low)과 근거 문항을 보여준다.</desc>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="22" fill="#fafafa" stroke="#e4e4e7"/>

  <line x1="780" y1="52" x2="780" y2="308" stroke="#e4e4e7" stroke-width="1"/>

  <!-- left: identity -->
  <g>
    <text x="56" y="66" font-size="19" font-weight="600" letter-spacing="1.5" fill="#71717a">CLAUDE CODE 워크숍 · 멀티에이전트 실습</text>

    <text x="54" y="158" font-size="76" font-weight="800" fill="#18181b">빨간펜</text>
    <text x="330" y="150" font-size="20" font-weight="600" letter-spacing="3" fill="#a1a1aa">RED PEN</text>
    <rect x="56" y="172" width="132" height="8" rx="4" fill="#be123c"/>

    <text x="56" y="226" font-size="26" font-weight="500" fill="#27272a">반복될 지적을 미리 잡고</text>
    <text x="56" y="260" font-size="26" font-weight="500" fill="#27272a">회의에서 나올 질문까지</text>
    <text x="56" y="294" font-size="26" font-weight="500" fill="#27272a">준비하는 멀티에이전트를 직접 만든다</text>

    <text x="56" y="332" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#71717a">3시간 · Claude Code · 8단계 · HITL → HOTL</text>
  </g>

  <!-- right: real mechanism — rubric confidence grading -->
  <g>
    <text x="812" y="78" font-size="17" font-weight="600" fill="#71717a">체크리스트 신뢰등급 · state/rubrics/*.md</text>

    <rect x="812" y="96" width="332" height="196" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>

    <circle cx="840" cy="140" r="7" fill="#be123c"/>
    <rect x="860" y="132" width="168" height="14" rx="7" fill="#fff1f2"/>
    <text x="860" y="168" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#71717a">high · 근거 문항 3, 7</text>

    <circle cx="840" cy="196" r="7" fill="#c2410c"/>
    <rect x="860" y="188" width="128" height="14" rx="7" fill="#fff7ed"/>
    <text x="860" y="224" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#71717a">medium · 근거 문항 5</text>

    <circle cx="840" cy="252" r="7" fill="#a1a1aa"/>
    <rect x="860" y="244" width="92" height="14" rx="7" fill="#f4f4f5"/>
    <text x="860" y="280" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#71717a">low · 근거 문항 9</text>

    <text x="812" y="315" font-size="14" fill="#a1a1aa">등급은 코드(weight_rubric)가 매긴다</text>
    <text x="812" y="333" font-size="14" fill="#a1a1aa">— 직접 판단하지 않는다</text>
  </g>

  <text x="1144" y="348" text-anchor="end" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#a1a1aa">github.com/saewookkangboy/redpen</text>
</svg>
